<!DOCTYPE html>
<html>
<head>
    <title>GlowBeauty Store</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f8;
        }

        header {
            background: #ff3f6c;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            background: black;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #ff3f6c;
        }

        .banner img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        h2 {
            text-align: center;
            color: #ff3f6c;
            margin-top: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            color: #ff3f6c;
            font-weight: bold;
            font-size: 18px;
        }

        button {
            background: #ff3f6c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #e60050;
        }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    GLOW BEAUTY
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Makeup</a>
    <a href="#">Skincare</a>
    <a href="#">Haircare</a>
    <a href="#">Offers</a>
</nav>

<div class="banner">
    <img src="https://picsum.photos/1200/400?random=1">
</div>

<h2>Trending Products</h2>

<section class="products">

    <div class="card">
        <img src="https://picsum.photos/400/400?random=2">
        <h3>Matte Lipstick</h3>
        <p class="price">₹499</p>
        <button>Shop Now</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/400?random=3">
        <h3>Liquid Foundation</h3>
        <p class="price">₹899</p>
        <button>Shop Now</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/400?random=4">
        <h3>Face Serum</h3>
        <p class="price">₹699</p>
        <button>Shop Now</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/400?random=5">
        <h3>Nail Paint Set</h3>
        <p class="price">₹399</p>
        <button>Shop Now</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/400?random=6">
        <h3>Shampoo</h3>
        <p class="price">₹299</p>
        <button>Shop Now</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/400/400?random=7">
        <h3>Conditioner</h3>
        <p class="price">₹349</p>
        <button>Shop Now</button>
    </div>

</section>

<footer>
    © 2026 Glow Beauty | Designed by Muskan 💕
</footer>

</body>
</html>
