<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix UI Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
}

/* HEADER */
header{
    position:fixed;
    width:100%;
    top:0;
    left:0;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
}

.logo{
    color:#e50914;
    font-size:28px;
    font-weight:bold;
}

/* HERO */
.hero{
    height:100vh;
    background:
      linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2)),
      url("https://images.unsplash.com/photo-1524985069026-dd778a71c7b4");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    padding:0 60px;
}

.hero-content{
    max-width:500px;
}

.hero h1{
    font-size:48px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    margin-bottom:20px;
}

.btn{
    padding:10px 25px;
    background:#e50914;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
    border-radius:4px;
}
